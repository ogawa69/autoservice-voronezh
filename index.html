<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <meta
      name="description"
      content="Диагностика, обслуживание и ремонт автомобилей в Воронеже. Проспект Революции, 9."
    />
    <title>Автосервис в Воронеже — диагностика и ремонт</title>
    <script>
      (() => {
        const hasDeepLink = window.location.hash && window.location.hash !== "#top";

        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = hasDeepLink ? "auto" : "manual";
        }

        if (!hasDeepLink) {
          window.scrollTo(0, 0);
          window.addEventListener(
            "pageshow",
            (event) => {
              if (!event.persisted) window.scrollTo(0, 0);
            },
            { once: true },
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
